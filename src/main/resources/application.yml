spring:
    application:
        name: api_todo_collaborative
    
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5431/todo_list_db}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:Thior552005}
        driver-class-name: org.postgresql.Driver

    jpa:
        database: postgresql
        show-sql: true
        hibernate:
            ddl-auto: create-drop
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    keystore-path: classpath:keystore.p12
    keystore-password: ${JWT_KEYSTORE_PASSWORD:Thior552005}   # variable d'env
    key-alias: jwt-key
    key-password: ${JWT_KEY_PASSWORD:Thior552005}             # variable d'env
    access-token-expiration: 900000       # 15 minutes en ms
    refresh-token-expiration: 604800000   # 7 jours en ms
        

logging:
    level:
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE
        # com.zaxxer.hikari: DEBUG