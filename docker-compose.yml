services:
  db:
    image: postgres
    container_name: todo_list_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5431:5432"
    volumes:
      - todo_list_volume:/var/lib/postgresql

volumes:
  todo_list_volume:
